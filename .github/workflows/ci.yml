name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify self-contained styles
        run: pnpm verify:styles
      - name: Check unified runtime boundary
        run: pnpm check:boundaries
      - name: Check component catalog
        run: pnpm catalog:check
      - name: Build
        run: pnpm build
      - name: Verify isolated runtime consumption
        run: pnpm test:runtime
      - name: Verify npm package contents
        run: pnpm pack:check
