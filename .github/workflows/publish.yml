name: Publish PRO

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.SNOWUI_GITHUB_ACTIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Publish components-pro
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          case "$VERSION" in
            *-alpha.*) NPM_TAG=alpha ;;
            *-beta.*) NPM_TAG=beta ;;
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac
          pnpm publish --access restricted --no-git-checks --tag "$NPM_TAG"
